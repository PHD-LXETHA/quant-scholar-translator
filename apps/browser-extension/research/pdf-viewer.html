<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="pdf-viewer.css"><title>Quant Scholar PDF Reader</title></head>
<body><header class="toolbar"><div class="brand"><img class="brand-icon" src="icons/icon-128.png" alt=""><strong>Quant Scholar PDF 专业阅读器</strong><small id="app-version" class="app-version"></small></div><input id="url" type="url" placeholder="粘贴 PDF 链接"><button id="open">打开</button><label class="file">本地 PDF<input id="file" type="file" accept="application/pdf"></label><div class="spacer"></div><div class="modes"><button data-mode="original">原版</button><button data-mode="overlay">保留版式</button><button data-mode="reading" class="active">阅读重排</button><button data-mode="bilingual">双栏对照</button></div><button id="auto-locate" class="auto-locate" aria-pressed="false" title="双栏对照中，选中文字后自动把另一侧对应语句移到屏幕中部" disabled>联动定位：关</button><div class="annotation-tools"><button id="mark-highlight" title="选中阅读重排中的文字后添加黄色标记">标记高亮</button><button id="erase-highlight" title="选中已有高亮后移除标记，不删除文字">擦除高亮</button></div><button id="translate" class="primary">翻译 PDF</button><button id="clear-cache" title="删除当前文献在本机保存的译文、批注和阅读位置" disabled>清除此文献缓存</button><button id="export-layout" title="保留原始页面、图表和坐标，另存为中文保版 PDF">导出保版 PDF</button><button id="export-pdf" title="将译文重排为适合连续阅读的 PDF">导出阅读版 PDF</button><button id="settings">设置</button></header>
<nav id="reader-tools" class="reader-tools" aria-label="PDF 阅读工具"><button id="toggle-outline" title="显示论文标题和章节导航" disabled>目录</button><span class="tool-separator"></span><button id="prev-page" title="上一页" disabled>‹</button><label class="page-control"><input id="page-number" type="number" min="1" value="1" disabled aria-label="页码"><span>/</span><span id="page-total">0</span></label><button id="next-page" title="下一页" disabled>›</button><span class="tool-separator"></span><button id="zoom-out" title="缩小" disabled>−</button><button id="zoom-value" title="点击切换适合宽度" disabled>100%</button><button id="zoom-in" title="放大" disabled>＋</button><span class="tool-separator"></span><label class="search-box"><input id="pdf-search" type="search" placeholder="搜索原文或译文" disabled><span id="search-count">0/0</span></label><button id="search-prev" title="上一个搜索结果" disabled>↑</button><button id="search-next" title="下一个搜索结果" disabled>↓</button></nav>
<section id="translation-task" class="translation-task" hidden aria-live="polite"><div class="task-head"><div><strong>PDF 翻译任务</strong><span id="task-state">准备就绪</span></div><button id="collapse-task" type="button" aria-label="收起翻译任务面板" aria-expanded="true">−</button></div><div id="task-body" class="task-body"><p id="task-estimate" class="task-estimate"></p><div class="task-progress-row"><progress id="task-progress" max="1" value="0"></progress><strong id="task-percent">0%</strong></div><p id="task-detail" class="task-detail">尚未开始</p><details id="task-errors" class="task-errors" hidden><summary>查看失败原因</summary><ol id="task-error-list"></ol></details><div class="task-actions"><button id="pause-translation" type="button" disabled>暂停</button><button id="cancel-translation" type="button" disabled>取消</button><button id="retry-failed" type="button" hidden>重试失败部分</button></div><small>Token 为本地粗略估算，实际用量与计费以 API 服务商记录为准。</small></div></section>
<aside id="pdf-outline" class="pdf-outline" hidden><header><strong>论文目录</strong><button id="close-outline" aria-label="关闭目录">×</button></header><div id="outline-items"></div></aside>
<div id="notice">请打开一个 PDF。网页中的 PDF 可从扩展弹窗一键送到这里。</div>
<section id="pdf-fallback" hidden><strong>论文站点阻止了直接读取</strong><p id="fallback-message"></p><p>如果原 PDF 已经在 Edge 中正常显示，可先点击“重试已打开的 PDF”，扩展会尝试复用浏览器刚刚加载成功的文件缓存。仍失败时，请在原 PDF 页面点击“保存”，然后选择下载的文件。PDF 只在本机解析，不会发送给翻译 API。</p><div class="fallback-actions"><button id="open-publisher-page" hidden>打开论文页完成验证</button><button id="retry-remote">重试已打开的 PDF</button><button id="choose-local" class="primary">选择已下载的 PDF</button></div></section>
<main id="pages"><div id="source-pages" class="pages-pane source-pages"></div><div id="translation-pages" class="pages-pane translation-pages"></div></main>
<script type="module" src="pdf-viewer.js"></script></body></html>
