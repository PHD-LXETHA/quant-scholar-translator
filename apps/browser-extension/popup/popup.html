<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Quant Scholar Translator</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1><span class="brand-mark">QS</span> Quant Scholar</h1>
      <p class="tagline">视频、网页与论文的本地优先双语学习工作台</p>
    </header>

    <main>
      <button id="toggle" class="primary">开始实时翻译</button>
      <div id="status" class="status idle">未开始</div>
      <div id="backendStatus" class="backend-status idle">本地引擎：检测中</div>

      <section class="settings">
        <label>
          原文语言
          <select id="sourceLang">
            <option value="auto" selected>自动识别</option>
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="ja">Japanese</option>
            <option value="ko">Korean</option>
            <option value="zh">Chinese</option>
            <option value="tr">Turkish</option>
            <option value="hi">Hindi</option>
          </select>
        </label>

        <label>
          译文语言
          <select id="targetLang">
            <option value="zh" selected>简体中文</option>
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="tr">Turkish</option>
          </select>
        </label>

        <label>
          专业领域
          <select id="domain">
            <option value="auto" selected>自动判断领域</option>
            <option value="finance">金融学</option>
            <option value="quant_finance">量化金融</option>
            <option value="economics">经济学</option>
            <option value="statistics">统计与计量</option>
            <option value="mathematics">数学</option>
            <option value="programming">编程与计算机</option>
          </select>
        </label>

        <label class="checkbox-row">
          <input type="checkbox" id="preferNativeCaptions" checked />
          优先使用网页原字幕（更准确，无字幕自动识别音频）
        </label>

        <label>
          字幕字号 <span id="fontSizeVal">28</span>px
          <input type="range" id="fontSize" min="14" max="56" step="2" value="28" />
        </label>

        <label>
          字幕位置
          <select id="position">
            <option value="bottom" selected>底部</option>
            <option value="top">顶部</option>
          </select>
        </label>

        <label>
          语音识别模型
          <select id="model">
            <option value="tiny">tiny（CPU 最快）</option>
            <option value="base">base</option>
            <option value="small">small</option>
            <option value="medium">medium</option>
            <option value="large-v3-turbo" selected>large-v3-turbo（推荐，GPU）</option>
            <option value="large-v3">large-v3（精度优先，速度较慢）</option>
          </select>
        </label>

        <label>
          运行设备
          <select id="device">
            <option value="auto" selected>自动选择（优先 GPU）</option>
            <option value="cuda">GPU（CUDA）</option>
            <option value="cpu">CPU（速度较慢）</option>
          </select>
        </label>

        <label>
          翻译引擎
          <select id="translator">
            <optgroup label="套餐登录（无需 API Key）">
              <option value="codex">Codex 套餐精译（较慢，非实时推荐）</option>
              <option value="kimi_subscription" selected>Kimi 套餐精译（较慢，非实时推荐）</option>
            </optgroup>
            <optgroup label="高级／本地模式">
              <option value="llm">Kimi / OpenAI 兼容 API（按量备用）</option>
              <option value="nllb">NLLB 本地翻译（离线）</option>
              <option value="google">Google 在线翻译</option>
              <option value="none">仅转写，不翻译</option>
            </optgroup>
          </select>
        </label>

        <label>
          本地服务地址
          <input type="text" id="backendUrl" value="ws://127.0.0.1:8765/ws" />
        </label>
      </section>
      <section class="settings">
        <strong class="section-heading">专业阅读与研究</strong>
        <button id="translatePage">翻译当前网页</button>
        <button id="togglePageTranslation">切换网页原文 / 译文</button>
        <button id="openPdfReader">在专业 PDF 阅读器中打开</button>
        <button id="openResearchSettings">套餐、API、Prompt 与术语设置</button>
        <button id="openLearningPanel">打开学习工作台侧栏</button>
        <button id="openLearningSettings">学习摘要模型设置</button>
      </section>
      <section class="settings">
        <strong class="section-heading">沉淀到个人知识库</strong>
        <button id="exportMarkdown">导出 Markdown</button>
        <button id="exportJson">导出结构化 JSON</button>
        <button id="exportSrt">导出双语 SRT</button>
        <button id="clearSession">清空当前学习记录</button>
      </section>
    </main>

    <footer>
      <span class="hint">Codex 与 Kimi 均可使用本机套餐登录；逐句实时字幕优先选 NLLB，论文、PDF 和学习整理优先选套餐精译。</span>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
