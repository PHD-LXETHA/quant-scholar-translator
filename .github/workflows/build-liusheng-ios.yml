name: Build Stillnote iOS

on:
  workflow_dispatch:
  push:
    branches: [codex/liusheng-ios]
    paths:
      - 'apps/ios/**'
      - '.github/workflows/build-liusheng-ios.yml'

permissions:
  contents: read

concurrency:
  # Each commit builds in its own workspace and publishes run-scoped artifacts.
  # Keep older checks intact without blocking verification of a corrected commit.
  group: liusheng-ios-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  ios:
    # Standard hosted runners on public repositories are free. Do not silently
    # consume a private repository's billed allowance.
    if: github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Show toolchain
        run: xcodebuild -version
      - name: Restore approved source files
        run: |
          python3 - <<'PY'
          import base64, hashlib, json
          from pathlib import Path, PurePosixPath
          bundle = json.loads(Path("apps/ios/Stillnote.sources.json").read_text())
          for item in bundle["files"]:
              relative = PurePosixPath(item["path"])
              if relative.is_absolute() or ".." in relative.parts or relative.parts[:2] != ("apps", "ios"):
                  raise ValueError("Source path outside approved iOS scope")
              data = base64.b64decode(item["content"], validate=True)
              if hashlib.sha256(data).hexdigest() != item["sha256"]:
                  raise ValueError("Source digest mismatch")
              target = Path(*relative.parts)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          print("Restored", len(bundle["files"]), "verified source files")
          PY
      - name: Test shared session model
        working-directory: apps/ios
        run: swift test
      - name: Compile iPhone app without signing credentials
        run: |
          xcodebuild -project apps/ios/LiuSheng.xcodeproj -scheme LiuSheng \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath output/ios-build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned app
        run: |
          mkdir -p output/ios-package/Payload
          cp -R output/ios-build/Build/Products/Release-iphoneos/LiuSheng.app output/ios-package/Payload/
          cd output/ios-package
          ditto -c -k --sequesterRsrc --keepParent Payload ../Stillnote-unsigned.ipa
      - name: Package restored source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile("output/Stillnote-ios-source.zip", "w", ZIP_DEFLATED) as archive:
              for path in sorted(Path("apps/ios").rglob("*")):
                  if path.is_file() and not any(part in {".build", "DerivedData", "xcuserdata"} for part in path.parts):
                      archive.write(path, path.relative_to("apps"))
          PY
      - name: Select iPhone simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","--json"]))
          phones=[device for runtime,rows in devices["devices"].items() if "iOS" in runtime for device in rows if device.get("isAvailable") and device["name"].startswith("iPhone")]
          if not phones: raise RuntimeError("No iPhone simulator available")
          phones.sort(key=lambda device:("Pro Max" not in device["name"],device["name"]))
          phone=phones[0]
          with open(os.environ["GITHUB_ENV"],"a") as stream: stream.write("SIMULATOR_ID="+phone["udid"]+"\n")
          print("Native UI preview device:",phone["name"])
          if phone["state"]!="Booted": subprocess.run(["xcrun","simctl","boot",phone["udid"]],check=True)
          subprocess.run(["xcrun","simctl","bootstatus",phone["udid"],"-b"],check=True)
          PY
      - name: Test native navigation and large text
        run: |
          xcodebuild test -project apps/ios/LiuSheng.xcodeproj -scheme StillnoteUI \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath output/ios-ui-build -resultBundlePath output/ios-ui-results.xcresult \
            -parallel-testing-enabled NO ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO
      - name: Export native UI screenshots
        if: always()
        run: |
          if [ -d output/ios-ui-results.xcresult ]; then
            xcrun xcresulttool export attachments --path output/ios-ui-results.xcresult --output-path output/ios-ui-screenshots
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Stillnote-native-ui-preview
          path: output/ios-ui-screenshots
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: Stillnote-unsigned-iphone
          path: |
            output/Stillnote-unsigned.ipa
            output/Stillnote-ios-source.zip
          if-no-files-found: error
          retention-days: 7
