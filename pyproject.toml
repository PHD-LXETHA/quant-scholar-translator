[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-scholar-translator"
version = "0.6.0"
description = "Local-first professional translation for technical video, web, and research material"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "LX.COCOSCENT" }]
keywords = ["translation", "whisper", "research", "pdf", "subtitles", "quant-finance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "websockets>=12",
  "numpy>=1.26",
  "faster-whisper>=1.1.0",
  "deep-translator>=1.11.4",
  "transformers>=5.0",
  "sentencepiece>=0.2",
]

[project.urls]
Homepage = "https://github.com/PHD-LXETHA/quant-scholar-translator"
Repository = "https://github.com/PHD-LXETHA/quant-scholar-translator"
Issues = "https://github.com/PHD-LXETHA/quant-scholar-translator/issues"

[project.optional-dependencies]
gpu = [
  "nvidia-cublas-cu12",
  "nvidia-cudnn-cu12",
  "nvidia-cuda-runtime-cu12",
  "nvidia-cuda-nvrtc-cu12",
]
pdf = ["BabelDOC==0.6.4"]
all = [
  "nvidia-cublas-cu12",
  "nvidia-cudnn-cu12",
  "nvidia-cuda-runtime-cu12",
  "nvidia-cuda-nvrtc-cu12",
  "BabelDOC==0.6.4",
]

[project.scripts]
quant-scholar = "quant_scholar_translator.cli:main"

[tool.setuptools]
packages = ["quant_scholar_translator"]

[tool.setuptools.package-data]
quant_scholar_translator = [
  "data/nllb-safe-terms.json",
  "data/*.csv",
  "data/glossaries/*.json",
  "data/schemas/*.json",
  "mobile/*",
]
